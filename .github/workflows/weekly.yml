name: Haftalik TED guncellemesi

on:
  schedule:
    - cron: "0 4 * * 1"   # Her pazartesi 07:00 (Istanbul)
  workflow_dispatch:
    inputs:
      days:
        description: "Kac gun geriye bakilsin (bos birakilirsa 21)"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TED verisini cek ve puanla
        run: node scripts/update.js
        env:
          DAYS: ${{ github.event.inputs.days }}
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "ted-bot"
          git config user.email "ted-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Haftalik TED verisi: $(date -u +%F)"
          git push
